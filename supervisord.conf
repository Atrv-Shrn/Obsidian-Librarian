[supervisord]
; Supervises: qdrant, redis, rag-mcp, agent-api, vault-sync.
nodaemon=true
; The entrypoint drops to the `librarian` user via gosu before exec'ing supervisord, so this
; is the identity all child programs (ollama/qdrant/redis/python) inherit.
user=librarian
logfile=/data/supervisord.log
pidfile=/data/supervisord.pid
childlogdir=/data

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

# --- Native servers (localhost) ---
# NOTE: there is deliberately no `ollama` program here. Local Ollama existed solely to serve
# the dense embedding model; FastEmbed ships nomic-embed-text-v1.5 and runs it in-process, so
# the server and its boot-blocking `ollama pull` were removed. Generation and the Ragas judge
# both use Ollama *Cloud* over HTTPS and need no local server. See rag/embeddings.py.

[program:qdrant]
; No --storage-snapshot-path: that flag does not exist (qdrant only has --storage-snapshot,
; which RESTORES a snapshot). Passing it made qdrant exit immediately with "unexpected
; argument" and supervisord parked the program in BACKOFF — the whole vector store was down
; while every other program reported RUNNING. Storage/snapshot locations come from `directory`
; below instead: qdrant resolves its defaults (./storage, ./snapshots) relative to its cwd, so
; both land on the persistent /data volume. `--config-path /dev/null` is intentional and works
; — it starts qdrant on built-in defaults with no config file present in the image.
command=/usr/local/bin/qdrant --config-path /dev/null
directory=/data/qdrant
autorestart=true
priority=10
stdout_logfile=/data/qdrant.log
stderr_logfile=/data/qdrant.err

[program:redis]
command=redis-server --dir /data/redis --save 60 1 --appendonly no
autorestart=true
priority=10
stdout_logfile=/data/redis.log
stderr_logfile=/data/redis.err

# --- Python app ---
[program:rag-mcp]
command=python -m obsidian_librarian.mcp.rag_server
directory=/app
autorestart=true
startsecs=5
priority=30
stdout_logfile=/data/rag-mcp.log
stderr_logfile=/data/rag-mcp.err

[program:agent-api]
command=python -m obsidian_librarian.api.openai_compat
directory=/app
autorestart=true
startsecs=5
priority=40
stdout_logfile=/data/agent-api.log
stderr_logfile=/data/agent-api.err

[program:vault-sync]
command=python -m obsidian_librarian.rag.sync.scheduler
directory=/app
autorestart=true
startsecs=10
priority=50
stdout_logfile=/data/vault-sync.log
stderr_logfile=/data/vault-sync.err